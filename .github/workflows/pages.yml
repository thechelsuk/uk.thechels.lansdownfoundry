name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify static site files
        run: |
          test -s index.html
          test -s styles.css
          test -s CNAME
          test -s robots.txt
          test -s sitemap.xml
          test -s llms.txt
          test -s fonts/Battledown-Regular.woff2
          test -s fonts/Battledown-Bold.woff2
          test -s fonts/Suffolks-Regular.woff2
          test -s fonts/Suffolks-Bold.woff2
          test -s fonts/Leckhampton-Regular.woff2
          test -s images/lansdown-foundry-icon.png
          test -s images/og-image.png
          test -s images/app-store-badge.svg
          test -s images/glyph-g.svg
          test -s images/glyph-Q.svg
          test -s images/ipad-draw.jpg
          test -s images/ipad-library.jpg
          test -s images/ipad-flair.jpg
          test -s images/ipad-spacing.jpg
          test -s images/ipad-export.jpg
          test -s images/ipad-new.jpg
          test -s images/mac-editor.jpg
          test -s images/mac-flair.jpg
          test -s images/mac-export.jpg

      - name: Assemble Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/images _site/fonts
          cp index.html styles.css CNAME robots.txt sitemap.xml llms.txt _site/
          cp fonts/Battledown-Regular.woff2 fonts/Battledown-Bold.woff2 fonts/Suffolks-Regular.woff2 fonts/Suffolks-Bold.woff2 fonts/Leckhampton-Regular.woff2 _site/fonts/
          cp images/lansdown-foundry-icon.png images/og-image.png images/app-store-badge.svg images/glyph-g.svg images/glyph-Q.svg images/ipad-draw.jpg images/ipad-library.jpg images/ipad-flair.jpg images/ipad-spacing.jpg images/ipad-export.jpg images/ipad-new.jpg images/mac-editor.jpg images/mac-flair.jpg images/mac-export.jpg _site/images/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
